name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor for the test tooling: the drift gate and its tests
        # import tomllib. The package itself still declares >=3.10, so the
        # floor is narrower here than in pyproject.toml — recorded as a
        # follow-up, not silently changed.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run the suite
        run: python -m pytest -q

      - name: Offline schema-drift gate
        run: python scripts/check_schema_sync.py --models-dir tests/fixtures/models --skip-openapi
